name: Build

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: true
        type: string
      signature_type:
        description: 'Signature type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify (Test, Lint, Assemble)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run verify checks
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest ktlintCheck lintDebug assembleDebug --stacktrace

  build:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      signature_type: ${{ steps.version.outputs.signature_type }}
      create_release: ${{ steps.version.outputs.create_release }}
      trigger_type: ${{ steps.version.outputs.trigger_type }}
      trigger_actor: ${{ steps.version.outputs.trigger_actor }}
      trigger_type_display: ${{ steps.version.outputs.trigger_type_display }}
      build_time: ${{ steps.version.outputs.build_time }}
      run_id: ${{ steps.version.outputs.run_id }}
      build_duration: ${{ steps.duration.outputs.duration }}
      apk_name: ${{ steps.apk_info.outputs.apk_name }}
      build_title: ${{ steps.build_title.outputs.title }}

    steps:
      # -------------------------------
      # 1. Checkout the repository
      # -------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch full history for changelog generation

      # -------------------------------
      # 2. Set up Java 21 (Temurin)
      # -------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # -------------------------------
      # 3. Configure Gradle
      # -------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------
      # 4. Record build start time for duration calculation
      # -------------------------------
      - name: Record build start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # -------------------------------
      # 5. Set all version, trigger, and environment variables
      # -------------------------------
      - name: Set version variables
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TRIGGER_TYPE="workflow_dispatch"
            TRIGGER_TYPE_DISPLAY="Manual trigger"
            TRIGGER_ACTOR="${{ github.actor }}"
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            SIGNATURE_TYPE="${{ github.event.inputs.signature_type }}"
            CREATE_RELEASE="${{ github.event.inputs.create_release }}"
          else
            TRIGGER_TYPE="push"
            TRIGGER_TYPE_DISPLAY="Push trigger"
            TRIGGER_ACTOR="${{ github.actor }}"
            VERSION_NAME="dev-${GITHUB_SHA::7}"
            SIGNATURE_TYPE="debug"
            CREATE_RELEASE="false"
          fi

          VERSION_CODE="${{ github.run_number }}"
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BRANCH_NAME="${GITHUB_REF_NAME}"
          RUN_ID="${{ github.run_id }}"

          # Output for later jobs
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "signature_type=$SIGNATURE_TYPE" >> $GITHUB_OUTPUT
          echo "create_release=$CREATE_RELEASE" >> $GITHUB_OUTPUT
          echo "trigger_type=$TRIGGER_TYPE" >> $GITHUB_OUTPUT
          echo "trigger_type_display=$TRIGGER_TYPE_DISPLAY" >> $GITHUB_OUTPUT
          echo "trigger_actor=$TRIGGER_ACTOR" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          # Environment variables for this job
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "SIGNATURE_TYPE=$SIGNATURE_TYPE" >> $GITHUB_ENV
          echo "CREATE_RELEASE=$CREATE_RELEASE" >> $GITHUB_ENV
          echo "TRIGGER_TYPE=$TRIGGER_TYPE" >> $GITHUB_ENV
          echo "TRIGGER_TYPE_DISPLAY=$TRIGGER_TYPE_DISPLAY" >> $GITHUB_ENV
          echo "TRIGGER_ACTOR=$TRIGGER_ACTOR" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # -------------------------------
      # 6. Set a human-readable build title
      # -------------------------------
      - name: Set build title
        id: build_title
        run: |
          if [[ "${{ env.SIGNATURE_TYPE }}" == "release" ]]; then
            TITLE="Release Build"
          else
            TITLE="Test Build"
          fi

          if [[ "${{ env.CREATE_RELEASE }}" == "true" ]]; then
            TITLE="${TITLE} (Publish to Releases)"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "BUILD_TITLE=$TITLE" >> $GITHUB_ENV

      # -------------------------------
      # 7. Prepare signing keystore
      # -------------------------------
      - name: Setup keystore for signing
        run: |
          if [[ "${{ steps.version.outputs.signature_type }}" == "release" ]]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
              echo "Release keystore decoded"
              ls -la release.keystore
            else
              echo "Error: KEYSTORE_BASE64 secret not found — cannot sign release build"
              exit 1
            fi
          fi

          # For debug builds, create a temporary debug keystore
          if [[ "${{ steps.version.outputs.signature_type }}" == "debug" ]]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Debug-CI, O=Android, C=CN" \
              -storepass android \
              -keypass android
            echo "Debug keystore created"
          fi

      # -------------------------------
      # 8. Build single universal APK (not per-ABI)
      #    Output: app-release.apk or app-debug.apk
      # -------------------------------
      - name: Build universal APK
        run: |
          chmod +x gradlew
          # Build the release variant (will be signed with the appropriate keystore via Gradle config)
          ./gradlew assembleRelease --stacktrace
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SIGNATURE_TYPE: ${{ steps.version.outputs.signature_type }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # -------------------------------
      # 9. Rename APK to a simple name like app-release.apk
      # -------------------------------
      - name: Rename APK
        if: success()
        run: |
          SIGNATURE_TYPE="${{ steps.version.outputs.signature_type }}"
          # Find the built APK (usually in app/build/outputs/apk/release/)
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          # Rename to app-{signature}.apk (e.g., app-release.apk, app-debug.apk)
          NEW_NAME="app-${SIGNATURE_TYPE}.apk"
          cp "$APK_FILE" "$NEW_NAME"
          echo "Renamed APK to $NEW_NAME"
          ls -lh "$NEW_NAME"

      # -------------------------------
      # 10. Generate git commit info file
      # -------------------------------
      - name: Generate git commit info
        if: success()
        run: |
          echo "Git Commit Information" > git-info.txt
          echo "======================" >> git-info.txt
          echo "Commit Hash: $(git rev-parse HEAD)" >> git-info.txt
          echo "Commit Message: $(git log -1 --pretty=%B)" >> git-info.txt
          echo "Author: $(git log -1 --pretty=%an)" >> git-info.txt
          echo "Date: $(git log -1 --pretty=%ad --date=iso)" >> git-info.txt
          echo "Branch: ${{ env.BRANCH_NAME }}" >> git-info.txt
          cat git-info.txt

      # -------------------------------
      # 11. Calculate build duration
      # -------------------------------
      - name: Calculate build duration
        id: duration
        if: success()
        run: |
          duration=$(( $(date +%s) - ${{ steps.start_time.outputs.start }} ))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "duration=${minutes}m ${seconds}s" >> $GITHUB_OUTPUT

      # -------------------------------
      # 12. Get APK info for outputs
      # -------------------------------
      - name: Get APK info
        id: apk_info
        if: success()
        run: |
          APK_FILE=$(ls app-*.apk 2>/dev/null | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "apk_name=$APK_FILE" >> $GITHUB_OUTPUT
          else
            echo "apk_name=not_found" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # 13. Print build success summary
      # -------------------------------
      - name: Build Success Output
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "${{ env.BUILD_TITLE }}"
          echo "========================================"
          echo ""
          echo "Build Info:"
          echo "  Version: v${{ env.VERSION_NAME }}"
          echo "  Build Number: ${{ env.VERSION_CODE }}"
          echo "  Signature Type: ${{ env.SIGNATURE_TYPE }}"
          echo "  Trigger: ${{ env.TRIGGER_TYPE }} (${{ env.TRIGGER_TYPE_DISPLAY }}) by @${{ env.TRIGGER_ACTOR }}"
          echo "  Duration: ${{ steps.duration.outputs.duration }}"
          echo "  APK: ${{ steps.apk_info.outputs.apk_name }}"
          echo ""
          echo "Download:"
          echo "  https://github.com/${{ github.repository }}/actions/runs/${{ env.RUN_ID }}"
          echo "========================================"

      # -------------------------------
      # 14. Write workflow job summary
      # -------------------------------
      - name: Generate Build Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ${{ env.BUILD_TITLE }}

          ### Build Info

          | Item | Value |
          |------|-------|
          | Version | v${{ env.VERSION_NAME }} |
          | Build Number | ${{ env.VERSION_CODE }} |
          | Signature Type | ${{ env.SIGNATURE_TYPE }} |
          | Trigger | ${{ env.TRIGGER_TYPE }} (${{ env.TRIGGER_TYPE_DISPLAY }}) by @${{ env.TRIGGER_ACTOR }} |
          | Branch | ${{ env.BRANCH_NAME }} |
          | Duration | ${{ steps.duration.outputs.duration }} |
          | APK | ${{ steps.apk_info.outputs.apk_name }} |

          ### Download

          - Artifact: DevInfo-${{ env.VERSION_NAME }}-${{ env.SIGNATURE_TYPE }}
          - [View Run Details](https://github.com/${{ github.repository }}/actions/runs/${{ env.RUN_ID }})

          ---
          *Generated by GitHub Actions*
          EOF

      # -------------------------------
      # 15. Upload APK and git-info as artifacts
      # -------------------------------
      - name: Upload APK and Git Info
        uses: actions/upload-artifact@v4
        with:
          name: DevInfo-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.signature_type }}
          path: |
            app-*.apk
            git-info.txt
          retention-days: 30

  # ------------------------------------------------------------------
  # Job: generate-changelog (only when creating a release)
  # ------------------------------------------------------------------
  generate-changelog:
    name: Generate Release Notes
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.create_release == 'true'
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      # Checkout code to access git history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate categorized changelog from commits since last tag
      - name: Generate changelog from commits
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --reverse)
          else
            COMMITS=$(git log --pretty=format:"%s" --reverse)
          fi

          # Initialize category strings
          UI=""
          LOGIC=""
          REPO=""
          FIX=""
          DOCS=""
          CI=""
          FEAT=""
          PERF=""
          REFACTOR=""
          CHORE=""
          STYLE=""
          TEST=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            # Categorize by commit prefix
            if [[ "$line" =~ ^ui: ]]; then
              msg="${line#ui: }"
              UI="${UI}- ${msg}"$'\n'
            elif [[ "$line" =~ ^logic: ]]; then
              msg="${line#logic: }"
              LOGIC="${LOGIC}- ${msg}"$'\n'
            elif [[ "$line" =~ ^repo: ]]; then
              msg="${line#repo: }"
              REPO="${REPO}- ${msg}"$'\n'
            elif [[ "$line" =~ ^fix: ]]; then
              msg="${line#fix: }"
              FIX="${FIX}- ${msg}"$'\n'
            elif [[ "$line" =~ ^docs: ]]; then
              msg="${line#docs: }"
              DOCS="${DOCS}- ${msg}"$'\n'
            elif [[ "$line" =~ ^ci: ]]; then
              msg="${line#ci: }"
              CI="${CI}- ${msg}"$'\n'
            elif [[ "$line" =~ ^feat: ]]; then
              msg="${line#feat: }"
              FEAT="${FEAT}- ${msg}"$'\n'
            elif [[ "$line" =~ ^perf: ]]; then
              msg="${line#perf: }"
              PERF="${PERF}- ${msg}"$'\n'
            elif [[ "$line" =~ ^refactor: ]]; then
              msg="${line#refactor: }"
              REFACTOR="${REFACTOR}- ${msg}"$'\n'
            elif [[ "$line" =~ ^chore: ]]; then
              msg="${line#chore: }"
              CHORE="${CHORE}- ${msg}"$'\n'
            elif [[ "$line" =~ ^style: ]]; then
              msg="${line#style: }"
              STYLE="${STYLE}- ${msg}"$'\n'
            elif [[ "$line" =~ ^test: ]]; then
              msg="${line#test: }"
              TEST="${TEST}- ${msg}"$'\n'
            else
              OTHER="${OTHER}- ${line}"$'\n'
            fi
          done <<< "$COMMITS"

          # Build sections in release body
          UPDATES=""
          [ -n "$UI" ] && UPDATES="${UPDATES}### UI"$'\n'$'\n'"${UI}"$'\n'
          [ -n "$LOGIC" ] && UPDATES="${UPDATES}### Logic/Core"$'\n'$'\n'"${LOGIC}"$'\n'
          [ -n "$REPO" ] && UPDATES="${UPDATES}### Repo/Build"$'\n'$'\n'"${REPO}"$'\n'
          [ -n "$FIX" ] && UPDATES="${UPDATES}### Bug Fixes"$'\n'$'\n'"${FIX}"$'\n'
          [ -n "$DOCS" ] && UPDATES="${UPDATES}### Documentation"$'\n'$'\n'"${DOCS}"$'\n'
          [ -n "$CI" ] && UPDATES="${UPDATES}### CI/CD"$'\n'$'\n'"${CI}"$'\n'
          [ -n "$FEAT" ] && UPDATES="${UPDATES}### Features"$'\n'$'\n'"${FEAT}"$'\n'
          [ -n "$PERF" ] && UPDATES="${UPDATES}### Performance Improvements"$'\n'$'\n'"${PERF}"$'\n'
          [ -n "$REFACTOR" ] && UPDATES="${UPDATES}### Refactoring"$'\n'$'\n'"${REFACTOR}"$'\n'
          [ -n "$CHORE" ] && UPDATES="${UPDATES}### Chores"$'\n'$'\n'"${CHORE}"$'\n'
          [ -n "$STYLE" ] && UPDATES="${UPDATES}### Code Style"$'\n'$'\n'"${STYLE}"$'\n'
          [ -n "$TEST" ] && UPDATES="${UPDATES}### Tests"$'\n'$'\n'"${TEST}"$'\n'
          [ -n "$OTHER" ] && UPDATES="${UPDATES}### Other"$'\n'$'\n'"${OTHER}"$'\n'

          if [ -z "$UPDATES" ]; then
            UPDATES="No detailed update log available. Please check the commit history."$'\n'
          fi

          # Retrieve build outputs from previous job
          VERSION_NAME="${{ needs.build.outputs.version_name }}"
          SIGNATURE_TYPE="${{ needs.build.outputs.signature_type }}"
          TRIGGER_TYPE="${{ needs.build.outputs.trigger_type }}"
          TRIGGER_TYPE_DISPLAY="${{ needs.build.outputs.trigger_type_display }}"
          TRIGGER_ACTOR="${{ needs.build.outputs.trigger_actor }}"
          BUILD_TIME="${{ needs.build.outputs.build_time }}"
          RUN_ID="${{ needs.build.outputs.run_id }}"
          BUILD_DURATION="${{ needs.build.outputs.build_duration }}"
          BUILD_TITLE="${{ needs.build.outputs.build_title }}"

          # Create full release body markdown
          cat > release_body.md <<RELEASE_EOF
          ## ${BUILD_TITLE}

          > Generated automatically from commit history.
          > This project is fully open-source and free, licensed under MIT.

          ---

          ### Update Contents

          ${UPDATES}

          ---

          ### Build Information

          | Item | Value |
          |------|-------|
          | Status | Success |
          | Duration | ${BUILD_DURATION} |
          | Trigger | ${TRIGGER_TYPE} (${TRIGGER_TYPE_DISPLAY}) by @${TRIGGER_ACTOR} |
          | Artifact | DevInfo-${VERSION_NAME}-${SIGNATURE_TYPE} |
          | Architectures | universal |
          | Output APK | app-${SIGNATURE_TYPE}.apk |
          | Build Details | [View Build Log #${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}) |

          ---

          *Generated by GitHub Actions*
          RELEASE_EOF

          # Output multiline changelog for next job
          {
            echo 'changelog<<EOF'
            cat release_body.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Display Release Notes
        run: |
          echo "========================================"
          echo "Release Notes Generated"
          echo "========================================"
          cat release_body.md

  # ------------------------------------------------------------------
  # Job: release (only when create_release is true)
  # ------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build, generate-changelog]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: needs.build.outputs.create_release == 'true'

    steps:
      # Download the single APK artifact
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: DevInfo-${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.signature_type }}
          path: apk/

      # Rename APK with version for release (keep git-info.txt if needed)
      - name: Prepare APK for release
        run: |
          cd apk/
          # The artifact contains app-release.apk or app-debug.apk and git-info.txt
          APK_FILE=$(ls app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "APK file not found in artifact!"
            exit 1
          fi
          SIGNATURE_TYPE="${{ needs.build.outputs.signature_type }}"
          VERSION_NAME="${{ needs.build.outputs.version_name }}"
          NEW_NAME="DevInfo-v${VERSION_NAME}-${SIGNATURE_TYPE}.apk"
          mv "$APK_FILE" "$NEW_NAME"
          echo "Release APK: $NEW_NAME"
          ls -lh "$NEW_NAME"

      # Create GitHub Release with the renamed APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version_name }}"
          name: "v${{ needs.build.outputs.version_name }}"
          body: ${{ needs.generate-changelog.outputs.changelog }}
          files: |
            apk/*.apk
          draft: false
          prerelease: ${{ needs.build.outputs.signature_type == 'debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Success Output
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "${{ needs.build.outputs.build_title }}"
          echo "========================================"
          echo ""
          echo "Release Info:"
          echo "  Version: v${{ needs.build.outputs.version_name }}"
          echo "  Tag: v${{ needs.build.outputs.version_name }}"
          echo "  Signature Type: ${{ needs.build.outputs.signature_type }}"
          echo "  APK: DevInfo-v${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.signature_type }}.apk"
          echo ""
          echo "Link:"
          echo "  https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version_name }}"
